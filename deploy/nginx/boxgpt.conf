limit_req_zone $binary_remote_addr zone=boxgpt_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=boxgpt_api:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;

    server_name demo.boxgpt.online;

    root /var/www/boxgpt-site;
    index index.html;
    client_max_body_size 20M;
    server_tokens off;
    limit_req_status 429;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # BOXGPT application routes. Uvicorn remains private on localhost.
    location = /login {
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
    }

    location = /app {
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_buffering off;
        proxy_cache off;
    }

    # Login is the only intentionally unauthenticated API operation.
    location = /api/auth/login {
        limit_req zone=boxgpt_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_buffering off;
        proxy_cache off;
    }

    # Explicit allowlist of API paths used by the authenticated web UI.
    location ~ ^/api/(?:auth/(?:me|logout)|documents(?:/[A-Za-z0-9_-]+/pdf)?|ask|questions(?:/[0-9]+/feedback)?|analytics)$ {
        limit_req zone=boxgpt_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Do not expose new or unknown API routes by accident.
    location /api/ {
        return 404;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
    }

    location = /health {
        return 404;
    }

    location ~ ^/(?:docs|redoc|openapi\.json)$ {
        return 404;
    }

    # Marketing website routes and extensionless HTML pages.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
